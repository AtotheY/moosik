[package]
name = "moosik-resolve"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Stream URL resolution for YouTube Music. Isolated on purpose: this is the layer that rots."

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

# Optional: pulls in the Boa JavaScript engine and ~28 transitive crates, by far the largest
# thing in the tree. Off by default — see the `native-resolver` feature below.
[dependencies.rusty_ytdl]
package = "youtui-vendored-rusty_ytdl"
version = "0.7.4-youtui-vendored.4"
default-features = false
features = ["live"]
optional = true

[features]
# The in-process resolver. **Off by default, deliberately.**
#
# It runs YouTube's player JS through Boa to decipher stream URLs, and at the M1 gate it could
# not produce a playable one: the URLs it returns carry no `n` parameter, so YouTube throttles
# them and `NativeResolver` rejects its own output. Meanwhile it is the single largest thing we
# compile — Boa alone is a 47 MB rlib. Paying that for a path the chain deliberately puts second
# and that fails its own validity check is not a trade worth making.
#
# The code and its tests stay, so the fast path can come back the day upstream fixes the `n`
# transform: build with `--features native-resolver` and re-run `resolve-spike`.
native-resolver = ["dep:rusty_ytdl"]

# Live tests hit YouTube for real. Run manually / nightly; they are the canary.
live-tests = []
