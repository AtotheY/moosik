<!doctype html>
<meta charset="utf-8">
<title>Moosik audio</title>
<audio hidden></audio>
<script>
const audio = document.querySelector('audio');
const requests = new AbortController();
const sessions = new Set();
const initDataSeen = new Set();
let stopped = false;
let errorCode = null;
let buffering = true;
let playing = false;
let desiredPaused = false;
let desiredVolume = 70;
let volumeChanged = false;
let pendingSeek = null;
let seekChanged = false;
let sourceUrl = null;
let mediaLoaded = false;
let sendingState = false;
let queuedState = null;

function snapshot() {
  return {
    position: Number.isFinite(audio.currentTime) ? audio.currentTime : 0,
    duration: Number.isFinite(audio.duration) ? audio.duration : 0,
    paused: audio.paused,
    ended: errorCode === null && (stopped || audio.ended),
    buffering: !stopped && errorCode === null && buffering,
    seeking: audio.seeking,
    rate: Number.isFinite(audio.playbackRate) ? audio.playbackRate : 1,
    volume: audio.volume * 100,
    muted: audio.muted,
    playing: playing && !stopped && errorCode === null && !audio.paused && !audio.ended && !buffering,
    ready: !stopped && errorCode === null && audio.readyState >= 2,
    errorCode,
  };
}

function publish() {
  queuedState = snapshot();
  if (!sendingState) void sendStates();
}

async function sendStates() {
  sendingState = true;
  try {
    while (queuedState) {
      const state = queuedState;
      queuedState = null;
      try {
        const response = await fetch('state', {
          method: 'POST',
          headers: {'content-type': 'application/json'},
          body: JSON.stringify(state),
          signal: AbortSignal.timeout(5000),
        });
        if (!response.ok && !stopped && errorCode === null) fail(10);
      } catch (_) {
        if (!stopped && errorCode === null) fail(10);
      }
    }
  } finally {
    sendingState = false;
  }
}

function fail(code) {
  if (stopped || errorCode !== null) return;
  errorCode = [1, 2, 3, 4, 10, 11, 12].includes(code) ? code : 10;
  playing = false;
  buffering = false;
  audio.pause();
  publish();
}

async function request(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    signal: AbortSignal.any([requests.signal, AbortSignal.timeout(30000)]),
  });
  if (!response.ok) throw new Error();
  return response;
}

function applySeek() {
  if (pendingSeek === null || audio.readyState < 1 || stopped || errorCode !== null) return;
  const target = Number.isFinite(audio.duration)
    ? Math.min(pendingSeek, Math.max(0, audio.duration))
    : pendingSeek;
  audio.currentTime = target;
  pendingSeek = null;
}

async function applyPause() {
  if (stopped || errorCode !== null) return;
  if (desiredPaused) {
    audio.pause();
  } else if (mediaLoaded) {
    try {
      await audio.play();
    } catch (_) {
      if (!desiredPaused && !stopped) fail(10);
    }
  }
}

function stop() {
  if (stopped) return;
  stopped = true;
  playing = false;
  buffering = false;
  requests.abort();
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
  if (sourceUrl) URL.revokeObjectURL(sourceUrl);
  for (const session of sessions) void session.close().catch(() => {});
  sessions.clear();
  publish();
}

async function commands() {
  while (!stopped && errorCode === null) {
    try {
      const response = await request('commands');
      const values = await response.json();
      if (!Array.isArray(values)) throw new Error();
      for (const command of values) {
        if (stopped) break;
        if (!command || typeof command !== 'object') continue;
        if (command.kind === 'pause' && typeof command.value === 'boolean') {
          desiredPaused = command.value;
          void applyPause();
        } else if (command.kind === 'seek' && Number.isFinite(command.value) && command.value >= 0) {
          seekChanged = true;
          pendingSeek = command.value;
          applySeek();
        } else if (command.kind === 'volume' && Number.isFinite(command.value)) {
          volumeChanged = true;
          desiredVolume = Math.max(0, Math.min(100, command.value));
          audio.volume = desiredVolume / 100;
        } else if (command.kind === 'stop') {
          stop();
        }
        publish();
      }
    } catch (_) {
      if (!stopped) fail(10);
    }
  }
}

audio.addEventListener('playing', () => {
  playing = true;
  buffering = false;
  publish();
});
audio.addEventListener('waiting', () => { buffering = true; playing = false; publish(); });
audio.addEventListener('stalled', () => {
  if (audio.readyState < 3 && !audio.paused && !audio.ended) {
    buffering = true;
    playing = false;
  }
  publish();
});
audio.addEventListener('pause', () => { playing = false; publish(); });
audio.addEventListener('ended', () => { playing = false; buffering = false; publish(); });
audio.addEventListener('error', () => fail(audio.error?.code));
audio.addEventListener('loadedmetadata', () => {
  try { applySeek(); } catch (_) { fail(10); }
  publish();
});
for (const event of ['loadeddata', 'canplay']) {
  audio.addEventListener(event, () => { buffering = false; publish(); });
}
for (const event of ['seeking', 'seeked', 'durationchange', 'volumechange', 'ratechange']) {
  audio.addEventListener(event, publish);
}

async function begin() {
  try {
    const media = request('media').then(response => response.arrayBuffer());
    void media.catch(() => {});
    if (!isSecureContext || typeof navigator.requestMediaKeySystemAccess !== 'function') {
      fail(11);
      return;
    }
    if (typeof MediaSource !== 'function' || !MediaSource.isTypeSupported('audio/mp4; codecs="mp4a.40.2"')) {
      fail(12);
      return;
    }
    let access;
    try {
      access = await navigator.requestMediaKeySystemAccess('com.widevine.alpha', [{
        initDataTypes: ['cenc'],
        audioCapabilities: [{contentType: 'audio/mp4; codecs="mp4a.40.2"'}],
        distinctiveIdentifier: 'optional',
        persistentState: 'optional',
        sessionTypes: ['temporary'],
      }]);
    } catch (_) {
      fail(11);
      return;
    }
    const meta = await (await request('meta')).json();
    if (stopped) return;
    if (!volumeChanged && Number.isFinite(meta.volume)) desiredVolume = Math.max(0, Math.min(100, meta.volume));
    audio.volume = desiredVolume / 100;
    if (!seekChanged && Number.isFinite(meta.startAt) && meta.startAt >= 0) pendingSeek = meta.startAt;
    if (stopped) return;
    const keys = await access.createMediaKeys();
    await audio.setMediaKeys(keys);
    audio.addEventListener('encrypted', async event => {
      if (stopped || errorCode !== null) return;
      try {
        if (event.initDataType !== 'cenc' || !event.initData) throw new Error();
        const identity = Array.from(new Uint8Array(event.initData)).join(',');
        if (initDataSeen.has(identity)) return;
        initDataSeen.add(identity);
        const session = keys.createSession('temporary');
        sessions.add(session);
        session.addEventListener('keystatuseschange', () => {
          for (const status of session.keyStatuses.values()) {
            if (['expired', 'released', 'output-restricted', 'internal-error'].includes(status)) fail(10);
          }
        });
        session.addEventListener('message', async event => {
          if (stopped || errorCode !== null) return;
          try {
            const response = await request('license', {method: 'POST', body: event.message});
            if (!stopped) await session.update(await response.arrayBuffer());
          } catch (_) {
            if (!stopped) fail(10);
          }
        });
        await session.generateRequest(event.initDataType, event.initData);
      } catch (_) {
        if (!stopped) fail(10);
      }
    });
    const certificate = await request('certificate');
    if (!await keys.setServerCertificate(await certificate.arrayBuffer())) throw new Error();
    const encrypted = await media;
    if (stopped || errorCode !== null) return;
    const source = new MediaSource();
    sourceUrl = URL.createObjectURL(source);
    const appended = new Promise((resolve, reject) => {
      source.addEventListener('sourceopen', () => {
        if (stopped || errorCode !== null) { resolve(); return; }
        try {
          const buffer = source.addSourceBuffer('audio/mp4; codecs="mp4a.40.2"');
          buffer.addEventListener('error', () => { fail(10); reject(new Error()); });
          buffer.addEventListener('updateend', () => {
            try { source.endOfStream(); resolve(); } catch (_) { reject(new Error()); }
          }, {once: true});
          buffer.appendBuffer(encrypted);
        } catch (_) { reject(new Error()); }
      }, {once: true});
    });
    audio.src = sourceUrl;
    await appended;
    if (stopped || errorCode !== null) return;
    mediaLoaded = true;
    applySeek();
    publish();
    await applyPause();
  } catch (_) {
    if (!stopped) fail(10);
  }
}

function tick() {
  if (stopped) return;
  publish();
  setTimeout(tick, !audio.paused && !audio.ended ? 250 : 1000);
}

audio.volume = desiredVolume / 100;
void commands();
void begin();
tick();
window.addEventListener('beforeunload', stop);
</script>
