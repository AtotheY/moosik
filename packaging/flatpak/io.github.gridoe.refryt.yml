# The Flatpak build of refryt. Built by scripts/build-flatpak.sh, which first fetches the pieces
# kept out of git (shared-modules/, yt-dlp). Needs the network at build time: cargo fetches the
# crates, and libplacebo is a git checkout with submodules. This is a build for a GitHub
# release, not for Flathub, which would want vendored sources.
app-id: io.github.gridoe.refryt
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: refryt

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  # Not `fallback-x11`: the sign-in window is WebKitGTK, which wry can only build into an X11
  # window, so refryt points that child at XWayland. `fallback-x11` would leave a Wayland session
  # with no X11 socket in the sandbox and the window could not open.
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  # Media keys and the desktop's media controls: the name playwire registers.
  - --own-name=org.mpris.MediaPlayer2.refryt
  # The tray icon, a StatusNotifierItem. Inside the sandbox it registers under the connection's
  # unique name, so it needs no name of its own (see `tray.rs`).
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # Discord Rich Presence connects to Discord's IPC socket.
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  # Downloads are written to ~/Music/refryt, so Music needs write access, not only read access;
  # it is also where Settings -> Library -> Local files looks.
  - --filesystem=xdg-music
  - --filesystem=xdg-download

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/refryt/cargo
    # The linker is not told about /app/lib, where libmpv lands.
    LIBRARY_PATH: /app/lib

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*.a
  - /share/man

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json
  # mpv's yt-dlp hook is a Lua script, and the `ytdl` option exists only with Lua built in.
  - shared-modules/lua5.1/lua-5.1.5.json

  # mpv needs libass, which the runtime lacks.
  - name: libass
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.xz
        sha256: eae425da50f0015c21f7b3a9c7262a910f0218af469e22e2931462fed3c50959

  # ... and libplacebo. Built with no GPU backends: refryt draws its own video through mpv's
  # software renderer, so only the core is wanted.
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddemos=false
      - -Dtests=false
      - -Dvulkan=disabled
      - -Dopengl=disabled
      - -Dd3d11=disabled
      - -Dglslang=disabled
      - -Dshaderc=disabled
      - -Dlcms=disabled
      - -Dunwind=disabled
    sources:
      # GitHub's mirror of VideoLAN's repository: the same tag, on a host the build can reach.
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.351.0
        commit: 98c1416e95b21cd767b84ac9ee430ccadf263ff6

  # libmpv only: refryt links it and plays audio through PulseAudio (PipeWire answers that).
  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dcplayer=false
      - -Dlibmpv=true
      - -Dbuild-date=false
      - -Dmanpage-build=disabled
      - -Dlua=lua51
      - -Djavascript=disabled
      - -Dgl=disabled
      - -Degl=disabled
      - -Dvulkan=disabled
      - -Dwayland=disabled
      - -Dx11=disabled
      - -Ddrm=disabled
      - -Dvaapi=disabled
      - -Dvdpau=disabled
      - -Dsdl2=disabled
      - -Dcaca=disabled
      - -Djack=disabled
      - -Dvapoursynth=disabled
      - -Dzimg=disabled
      - -Duchardet=disabled
      - -Dlcms2=disabled
      - -Dpulse=enabled
      - -Dalsa=enabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.40.0.tar.gz
        sha256: 10a0f4654f62140a6dd4d380dcf0bbdbdcf6e697556863dc499c296182f081a3

  # yt-dlp: the resolver for songs YouTube's own endpoint will not hand over, the video view and
  # downloads. The build script fetches the newest release into this directory first, as the
  # AppImage build does. refryt looks for it beside its own executable.
  # The tray's menu library (muda) links libxdo, which the runtime lacks. Only the library.
  - name: xdotool
    buildsystem: simple
    build-commands:
      - make PREFIX=/app libxdo.so
      - make PREFIX=/app installlib installheader installpc
    sources:
      - type: archive
        url: https://github.com/jordansissel/xdotool/archive/refs/tags/v4.20260303.1.tar.gz
        sha256: c1f971a384da588eb99ca0755fc4300316d49c1e612537e3f1de52215e104fa3

  - name: yt-dlp
    buildsystem: simple
    build-commands:
      - install -Dm755 yt-dlp /app/bin/yt-dlp
    sources:
      - type: file
        path: yt-dlp

  - name: refryt
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - cargo build --release -p refryt --bin refryt
      - install -Dm755 target/release/refryt /app/bin/refryt
      - install -Dm644 packaging/flatpak/io.github.gridoe.refryt.desktop -t /app/share/applications
      - install -Dm644 packaging/flatpak/io.github.gridoe.refryt.metainfo.xml -t /app/share/metainfo
      - |
        for s in 16 32 48 64 128 256 512; do
          install -Dm644 assets/icons/app/refryt-$s.png \
            /app/share/icons/hicolor/${s}x${s}/apps/io.github.gridoe.refryt.png
        done
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - target
          - dist
          - .appimage-tools
          - .windows-tools
          - packaging/flatpak/.flatpak-builder
          - packaging/flatpak/build-dir
