name: Moosik Linux release
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential cmake pkg-config libmpv-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev libxdo-dev libxkbcommon-dev \
            libwayland-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: moosik-release-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ./scripts/build-linux-deb.sh
      - name: Checksum package
        working-directory: dist
        run: sha256sum moosik-*-linux-amd64.deb > moosik-linux-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: moosik-linux
          path: |
            dist/moosik-*-linux-amd64.deb
            dist/moosik-linux-SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: moosik-linux
          path: dist
      - name: Install and render on clean Ubuntu
        working-directory: dist
        run: |
          sha256sum --check moosik-linux-SHA256SUMS.txt
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ./moosik-*-linux-amd64.deb dbus-daemon xvfb xauth libgl1-mesa-dri desktop-file-utils
          desktop-file-validate /usr/share/applications/moosik.desktop
          /usr/lib/moosik/yt-dlp --version
          useradd -m smoke
          runuser -u smoke -- env HOME=/home/smoke LIBGL_ALWAYS_SOFTWARE=1 \
            dbus-run-session -- xvfb-run -a timeout 90s moosik --screenshot /home/smoke/window.png --screenshot-after 2
          test -s /home/smoke/window.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-launch-preview
          path: /home/smoke/window.png
          if-no-files-found: ignore
