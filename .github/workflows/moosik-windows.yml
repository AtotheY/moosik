name: Moosik Windows release
on:
  push:
    branches: [codex/windows-distribution]
  workflow_call:
  workflow_dispatch:
    inputs:
      interactive_pin:
        description: Exercise a real Explorer pin and inspect the taskbar artwork
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: moosik-windows-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
  INNO_SETUP_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/stamp-release
      - name: Install packages
        run: |
          ./scripts/install-ubuntu-deps.sh g++-mingw-w64-x86-64 p7zip-full python3-pil
      - name: Rust target
        run: rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - name: Build the portable ZIP
        run: ./scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/moosik-*-windows-x86_64.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: dist
      - name: Compile setup from the portable ZIP
        shell: pwsh
        run: |
          $zip = Get-Item dist/moosik-*-windows-x86_64.zip
          if ($zip.BaseName -notmatch '^moosik-(\d+\.\d+\.\d+)-windows-x86_64$') { throw "Unexpected filename: $zip" }
          $version = $Matches[1]
          $stage = Join-Path $env:RUNNER_TEMP 'stage'
          Expand-Archive $zip.FullName $stage
          $download = Join-Path $env:RUNNER_TEMP 'inno.exe'
          $compiler = Join-Path $env:RUNNER_TEMP 'inno'
          Invoke-WebRequest $env:INNO_SETUP_URL -OutFile $download
          if ((Get-FileHash $download).Hash -ne $env:INNO_SETUP_SHA256) { throw 'Unexpected Inno Setup checksum' }
          $install = Start-Process $download -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$compiler`"" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Compiler installer failed: $($install.ExitCode)" }
          & "$compiler/ISCC.exe" /Q "/DAppVersion=$version" "/DStageDir=$stage/Moosik" scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Checksum the ZIP and installer
        shell: bash
        working-directory: dist
        run: sha256sum moosik-*-windows-x86_64.zip moosik-*-windows-x86_64-setup.exe > moosik-windows-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: moosik-windows
          path: dist/moosik-*
          compression-level: 0
          if-no-files-found: error
  smoke:
    needs: installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - uses: actions/download-artifact@v4
        with:
          name: moosik-windows
          path: dist
      - name: Install and launch on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem dist/*-setup.exe).FullName
          $dest = Join-Path $env:RUNNER_TEMP 'MoosikSmoke'
          $setup = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dest" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          @('moosik.exe','libmpv-2.dll','WebView2Loader.dll','yt-dlp.exe','NotoColorEmoji.ttf','LICENSE.txt','NOTICE.txt') | ForEach-Object {
            if (!(Test-Path (Join-Path $dest $_))) { throw "Missing $_" }
          }
          & "$dest/yt-dlp.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'yt-dlp failed' }
          # A clean unpinned install. The pinned-upgrade job pins through Explorer;
          # dropping a .lnk straight into the pin folder does not create a real pin.
          $roaming = [Environment]::GetFolderPath('ApplicationData')
          $config = Join-Path $roaming 'moosik\config'
          New-Item -Type Directory -Force $config | Out-Null
          '{"app_icon":"amber"}' | Set-Content (Join-Path $config 'settings.json') -Encoding utf8NoBOM
          $start = [Diagnostics.ProcessStartInfo]::new("$dest/moosik.exe", '--tray-test stdin')
          $start.UseShellExecute = $false
          $start.RedirectStandardInput = $true
          $app = [Diagnostics.Process]::Start($start)
          Start-Sleep -Seconds 20
          $app.Refresh()
          if ($app.HasExited) {
            Get-Content (Join-Path $config 'moosik.log') -Tail 30 -ErrorAction SilentlyContinue
            throw "App exited early: $($app.ExitCode)"
          }
          if ($app.MainWindowHandle -eq 0) { Stop-Process -Id $app.Id; throw 'No application window appeared' }
          Write-Output "Moosik window opened: $($app.MainWindowTitle)"
          $icon = Join-Path $dest 'icons\amber.ico'
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class WindowIcon {
            [DllImport("user32.dll", CharSet=CharSet.Unicode)]
            public static extern IntPtr SendMessage(IntPtr hwnd, uint msg, IntPtr wparam, IntPtr lparam);
          }
          '@
          if ([WindowIcon]::SendMessage($app.MainWindowHandle, 0x007F, [IntPtr]1, [IntPtr]0) -eq [IntPtr]::Zero) {
            throw "Running window has no taskbar icon (WM_GETICON / ICON_BIG)"
          }
          ./scripts/tests/windows-taskbar.ps1 -Window $app.MainWindowHandle -Exe (Join-Path $dest 'moosik.exe') -Icon $icon
          python scripts/tests/windows-taskbar-image.py $icon "$env:RUNNER_TEMP/taskbar.png"
          if ($LASTEXITCODE -ne 0) { throw 'Taskbar artwork did not match the selected finish' }
          ./scripts/tests/windows-tray-restore.ps1 -App $app
          $uninstall = Start-Process "$dest/unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-taskbar-preview
          path: ${{ runner.temp }}/taskbar.png
          if-no-files-found: ignore

  shortcut-upgrade:
    needs: installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: moosik-windows
          path: dist
      - name: Fetch the installer that introduced icon selection on the taskbar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download moosik-v0.1.20 -p '*-setup.exe' -D old
          $file = (Get-ChildItem old/*-setup.exe).FullName
          if ((Get-FileHash $file).Hash -ne '295812973cbe64642babbe8ad48b9e8edeb003cd5f317c132e22a9526ae58f5a') { throw 'Unexpected 0.1.20 installer' }
      - name: Verify the old installer upgrades and its shortcut migrates
        if: ${{ !inputs.interactive_pin }}
        shell: powershell
        run: ./scripts/tests/windows-shortcut-upgrade.ps1
      - name: Install interactive test dependency
        if: inputs.interactive_pin
        run: python -m pip install pillow
      - name: Pin the old install in Explorer and verify the upgraded taskbar open and closed
        if: inputs.interactive_pin
        shell: powershell
        run: ./scripts/tests/windows-pinned-upgrade.ps1
      - uses: actions/upload-artifact@v4
        if: always() && inputs.interactive_pin
        with:
          name: upgraded-taskbar
          path: taskbar-*.png
          if-no-files-found: ignore
