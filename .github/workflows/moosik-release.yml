name: Moosik release
on:
  push:
    tags: ['moosik-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moosik-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos-checks:
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - run: brew install mpv
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p refryt --lib --tests -- -D warnings
      - run: cargo test --locked -p refryt --lib
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -q
  macos:
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always
      MOOSIK_DISTRIBUTION: '1'
      # Pin the app certificate to prevent silent signing identity changes.
      # It can be self-signed; Apple membership/notarization remain optional.
      MOOSIK_NOTARIZE: ${{ vars.MOOSIK_NOTARIZE || '0' }}
      MOOSIK_SIGNING_IDENTITY: ''
      MOOSIK_APP_NAME: Moosik
      MOOSIK_UPDATE_PUBLIC_KEY: ${{ vars.MOOSIK_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version and release configuration
        id: version
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          UPDATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os,re,tomllib
          v=tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+',v), 'Bump Cargo.toml to a public SemVer first'
          if os.environ['GITHUB_REF_TYPE']=='tag':
              assert os.environ['GITHUB_REF_NAME']=='moosik-v'+v, 'Tag/version mismatch'
          assert os.environ.get('UPDATE_KEY'), 'Missing SPARKLE_PRIVATE_KEY secret'
          assert os.environ.get('CERTIFICATE'), 'Missing persistent MACOS_CERTIFICATE_P12; ad hoc releases change app identity'
          assert os.environ.get('CERTIFICATE_PASSWORD'), 'Missing certificate password'
          if os.environ.get('MOOSIK_NOTARIZE')=='1':
              for key in ['CERTIFICATE','CERTIFICATE_PASSWORD','APPLE_ID','APPLE_PASSWORD','APPLE_TEAM_ID']:
                  assert os.environ.get(key), 'Missing optional Apple notarization configuration: '+key
          assert os.environ.get('MOOSIK_UPDATE_PUBLIC_KEY') or os.path.exists('packaging/macos/update-public-key.txt'), 'Missing public update key'
          assert os.path.isfile('release-notes/'+v+'.md'), 'Write release notes before building'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('version='+v+'\n')
          PY
          if [ "$GITHUB_REF_TYPE" = tag ]; then git merge-base --is-ancestor "$GITHUB_SHA" origin/main; fi
      - run: brew install mpv dylibbundler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: moosik-release-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Import persistent release certificate into a temporary keychain
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$CERTIFICATE"
          keychain="$RUNNER_TEMP/moosik-release.keychain-db"
          password="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          export CERT_FILE="$RUNNER_TEMP/moosik.p12"
          python3 -c 'import base64,os; open(os.environ["CERT_FILE"],"wb").write(base64.b64decode(os.environ["CERTIFICATE"]))'
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$CERT_FILE" -P "$CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          if [ "$MOOSIK_NOTARIZE" = 1 ]; then
            identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/{print $2; exit}')"
          else
            identity="$(security find-identity -p codesigning "$keychain" | awk '/"/{print $2; exit}')"
          fi
          test -n "$identity"
          expected="$(tr -d '[:space:]' < packaging/macos/release-signing-identity.txt)"
          test "$identity" = "$expected" || { echo 'Release signing identity changed; review the identity migration before publishing.' >&2; exit 1; }
          echo "MOOSIK_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          rm -f "$CERT_FILE"
      - name: Build and verify signed bundle
        run: |
          ./scripts/build-macos.sh
          ./scripts/verify-macos-release-signing.sh dist/Moosik.app
      - name: Optional Apple notarization
        if: env.MOOSIK_NOTARIZE == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip="dist/moosik-$VERSION-macos-arm64.zip"
          xcrun notarytool submit "$zip" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple dist/Moosik.app
          codesign --verify --deep --strict dist/Moosik.app
          spctl --assess --type execute --verbose dist/Moosik.app
          rm "$zip"
          ditto -c -k --sequesterRsrc --keepParent dist/Moosik.app "$zip"
          # The initial download uses the same notarized app as the updater.
          rm "dist/moosik-$VERSION-macos-arm64.dmg"
          mkdir -p "$RUNNER_TEMP/moosik-dmg"
          ditto dist/Moosik.app "$RUNNER_TEMP/moosik-dmg/Moosik.app"
          ln -s /Applications "$RUNNER_TEMP/moosik-dmg/Applications"
          hdiutil create -quiet -volname Moosik -srcfolder "$RUNNER_TEMP/moosik-dmg" -ov -format UDZO "dist/moosik-$VERSION-macos-arm64.dmg"
          dmg="dist/moosik-$VERSION-macos-arm64.dmg"
          codesign --sign "$MOOSIK_SIGNING_IDENTITY" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
      - name: Sign the update and generate the feed
        env:
          UPDATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          umask 077
          printf '%s' "$UPDATE_KEY" > "$RUNNER_TEMP/sparkle-private.key"
          swift scripts/verify-update-key.swift "$RUNNER_TEMP/sparkle-private.key" dist/Moosik.app/Contents/Info.plist
          .ark-build/sparkle-2.10.1/bin/sign_update --ed-key-file "$RUNNER_TEMP/sparkle-private.key" -p "dist/moosik-$VERSION-macos-arm64.zip" > "$RUNNER_TEMP/update-signature.txt"
          rm "$RUNNER_TEMP/sparkle-private.key"
          minimum="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' dist/Moosik.app/Contents/Info.plist)"
          python3 scripts/macos-update-feed.py "$VERSION" "dist/moosik-$VERSION-macos-arm64.zip" --signature-file "$RUNNER_TEMP/update-signature.txt" --notes "release-notes/$VERSION.md" --minimum-system-version "$minimum"
          (cd dist && shasum -a 256 moosik-*.zip moosik-*.dmg appcast.xml) > "$RUNNER_TEMP/SHA256SUMS.txt"
          cp "$RUNNER_TEMP/SHA256SUMS.txt" "dist/moosik-$VERSION-SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: moosik-macos
          compression-level: 0
          path: |
            dist/moosik-*.zip
            dist/moosik-*.dmg
            dist/moosik-*-SHA256SUMS.txt
            dist/appcast.xml
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sparkle-private.key" "$RUNNER_TEMP/moosik.p12"
          security delete-keychain "$RUNNER_TEMP/moosik-release.keychain-db" || true
  linux:
    uses: ./.github/workflows/moosik-linux.yml
  windows:
    uses: ./.github/workflows/moosik-windows.yml
  publish:
    if: github.ref_type == 'tag'
    needs: [macos-checks, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: moosik-macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: moosik-windows
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: moosik-linux
          path: linux
      - name: Publish a complete release
        run: |
          version="${GITHUB_REF_NAME#moosik-v}"
          mv "linux/moosik-$version-linux-amd64.deb" dist/
          mv "windows/moosik-$version-windows-x86_64-setup.exe" "windows/moosik-$version-windows-x86_64.zip" dist/
          cat windows/moosik-windows-SHA256SUMS.txt linux/moosik-linux-SHA256SUMS.txt >> "dist/moosik-$version-SHA256SUMS.txt"
          (cd dist && sha256sum --check "moosik-$version-SHA256SUMS.txt")
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --title "Moosik $version" --notes-file "release-notes/$version.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
